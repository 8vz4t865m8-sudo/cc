name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install full Xcode (包含iOS SDK)
        run: |
          xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Get iOS SDK path
        id: sdkpath
        run: |
          echo "SDK=$(xcodebuild -sdk iphoneos -version Path)" >> $GITHUB_ENV

      - name: Compile arm64 iOS dylib
        run: |
          clang -dynamiclib \
          -arch arm64 \
          -mios-version-min=15.0 \
          -isysroot ${{ env.SDK }} \
          -framework Foundation -framework UIKit \
          -fobjc-arc \
          kfun_bypass.m -o kfun_bypass.dylib

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: kfun_bypass
          path: kfun_bypass.dylib
