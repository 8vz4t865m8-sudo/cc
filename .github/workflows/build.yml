name: Build KFun Autopsy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 dylib
        run: |
          clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit \
            -framework Foundation \
            -lobjc \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -O2 \
            -Wl,-undefined,dynamic_lookup \
            KFunAutopsy.m \
            -o KFunAutopsy.dylib
          echo "Dylib size: $(ls -lh KFunAutopsy.dylib)"
          file KFunAutopsy.dylib

      - name: 签名
        run: |
          brew install ldid-procursus 2>/dev/null || brew install ldid 2>/dev/null || echo "ldid 可能已安装"
          ldid -S KFunAutopsy.dylib
          echo "签名完成"
          codesign -dv KFunAutopsy.dylib 2>&1 | head -5

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KFunAutopsy
          path: KFunAutopsy.dylib
