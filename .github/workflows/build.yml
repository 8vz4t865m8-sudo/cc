name: Build KfunBypass Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 dylib
        run: |
          clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -Wno-deprecated-declarations \
            -Wno-objc-missing-super-calls \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            kfun_bypass.m \
            -o kfun_bypass.dylib
          echo "Dylib size: $(ls -lh kfun_bypass.dylib)"

      - name: ldid自动签名
        run: |
          brew install ldid
          ldid -S kfun_bypass.dylib
          echo "签名完成"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kfun_bypass
          path: kfun_bypass.dylib
